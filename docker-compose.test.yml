# The client-side suite, against a container built from this checkout.
#
#   docker compose -f docker-compose.test.yml up --build --exit-code-from tests
#
# Nothing is published to the host and storage is in memory, so this is safe to run
# alongside a mock-s3 you are already using on port 9000.

services:
  mock-s3:
    build: .
    image: rapturedotsh/mock-s3:dev
    # Overriding the command rather than setting MOCK_S3_IN_MEMORY, because a flag is
    # unambiguous where a boolean environment variable is not.
    command: ["--in-memory"]
    expose:
      - "9000"
      - "9001"

  tests:
    image: node:22-slim
    depends_on:
      - mock-s3
    working_dir: /tests
    volumes:
      - ./tests:/tests
    environment:
      S3_ENDPOINT: http://mock-s3:9000
      S3_CONSOLE_ENDPOINT: http://mock-s3:9001
    # depends_on only waits for the container to start, not for the port to answer, so
    # poll the admin endpoint before handing over to vitest.
    command:
      - sh
      - -c
      - |
        until node -e "fetch('http://mock-s3:9001/_admin/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; do
          echo "waiting for mock-s3"; sleep 1;
        done
        corepack enable
        pnpm install --no-frozen-lockfile
        pnpm test
