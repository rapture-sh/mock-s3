name: Bug report
description: mock-s3 is broken, or behaves differently from real S3
labels: ["bug"]
body:
  - type: input
    id: operation
    attributes:
      label: Which operation
      placeholder: ListObjectsV2
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you called, what you expected, what you got instead.
    validations:
      required: true

  - type: textarea
    id: real-s3
    attributes:
      label: What real S3 does
      description: >
        If this is a compatibility difference rather than a crash, say what AWS
        returns instead. A doc link or a real observed response is ideal — it is
        what makes the fix verifiable.

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: >
        The smallest snippet or sequence of requests that triggers it. Include
        the response body if there is one.
      render: text
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: "@aws-sdk/client-s3 3.901.0, or boto3 1.40.12"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: mock-s3 version
      description: Image tag, or the commit you built from.
      placeholder: ghcr.io/rapture-sh/mock-s3:latest
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: How are you running it
      options:
        - Docker
        - Built from source
        - mock-s3-testkit, in-process
    validations:
      required: true
