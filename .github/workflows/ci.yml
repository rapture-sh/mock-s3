name: CI

# Deliberately small. Rust builds are slow and this is an early project, so CI covers
# the checks that catch a real break and nothing else: format, lint, the test suite, and
# whether the console still compiles.
#
# What is left out on purpose, and run by hand instead:
#   - tests/            the JavaScript SDK suite, which needs a server running beside it
#   - tests/cli/        the AWS CLI script, which pulls the amazon/aws-cli image
#   - tests/s3-tests/   the ceph compatibility suite, ~16 minutes and a measurement
#                       rather than a gate
#
# If CI starts feeling slow, delete a job rather than adding a cache.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    # Blacksmith, because this is the job worth paying to shorten. Two vCPU because
    # larger sizes queue without ever being picked up on the current plan, raise it
    # if that changes. See release.yml for what to use in a fork without Blacksmith.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the version, so rustup installs it from the checkout and
      # this needs no version here.
      - name: Install the pinned toolchain
        run: rustup show

      # Without this, every run recompiles the whole dependency tree.
      #
      # It does nothing at the moment, and the warning it prints is not worth chasing.
      # Blacksmith intercepts the Actions cache API transparently, and their service
      # answers every call for this repository with
      # `400 Default branch not found for repository`, so both the restore and the save
      # fail. It is their end, not this file: the same error hits `actions/setup-node`
      # in the console job. Nothing here changes it, and the job still finishes in under
      # two minutes cold. If Blacksmith has not picked the repository up by the time
      # anyone reads this, delete the step rather than debugging it.
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --all-targets --all-features -- -D warnings

      # Unit and conformance tests both. The conformance suite drives a real aws-sdk-s3
      # client against an in-process instance, so it needs no services.
      - run: cargo test --workspace

  console:
    name: Console
    # A pnpm build does not need four cores.
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v7

      # The version comes from web/package.json. Without package_json_file the action
      # looks in the repository root, where there is no package.json at all.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: web

      - run: pnpm lint
        working-directory: web

      - run: pnpm typecheck
        working-directory: web

      - run: pnpm build
        working-directory: web
