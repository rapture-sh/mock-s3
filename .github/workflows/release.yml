name: Release

# Publishes the container image when a version tag is pushed.
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Nothing here runs on an ordinary push: `latest` has to mean the newest release, not
# the newest commit, or anyone who wrote `image: rapturedotsh/mock-s3` in a compose file
# is running whatever landed on main an hour ago.
#
# Each architecture builds on a machine of that architecture. The alternative is QEMU,
# which emulates an ARM CPU to run rustc. For a release build with fat LTO that turns a
# few minutes into the better part of an hour.
#
# The blacksmith-* label needs the Blacksmith GitHub App installed on the repository. A
# fork without it sees that job queue forever rather than fail, which is a confusing way
# to find out: swap it for `ubuntu-latest`, which is free for public repositories and
# works the same way.

on:
  push:
    tags: ["v*"]

env:
  DOCKERHUB_IMAGE: rapturedotsh/mock-s3

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: blacksmith-2vcpu-ubuntu-2404
          - platform: linux/arm64
            # GitHub's own ARM runner, not Blacksmith. The blacksmith-*-arm labels are
            # not served on this account's plan: a job asking for one is accepted and
            # then queues forever rather than failing, which is a slow way to find out.
            # This one is native ARM and free for public repositories.
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Each build pushes a nameless image identified only by its digest. The tags are
      # attached once, in the merge job, to the index that covers both architectures,
      # so there is never a moment where `latest` means one architecture.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # No cache, deliberately. A shared cache is a way for a poisoned entry to put
          # content into a published image, and the native build is a couple of minutes
          # anyway: the wrong trade to make on the one artifact people actually run.
          no-cache: true

      # Run the image before anything is tagged. The publish job needs this one, so a
      # broken build cannot become `latest` and be found by whoever pulls next.
      - name: Smoke-test the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 9000:9000 -p 9001:9001             "${DOCKERHUB_IMAGE}@${DIGEST}"

          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:9000/ >/dev/null 2>&1; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs smoke; exit 1; fi

          curl -fsS http://localhost:9001/_admin/health | grep -q '"status":"ok"'

          # A round trip, not just liveness: the thing this image exists to do.
          curl -fsS -X PUT http://localhost:9000/smoke-bucket -o /dev/null
          printf 'hello' | curl -fsS -X PUT --data-binary @-             http://localhost:9000/smoke-bucket/key.txt -o /dev/null
          test "$(curl -fsS http://localhost:9000/smoke-bucket/key.txt)" = "hello"

          # The console is embedded, so a missing web/dist shows up here too.
          curl -fsS http://localhost:9001/ | grep -q "<title>mock-s3</title>"

          docker rm -f smoke

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish
    # Stitching a manifest is a few API calls, so this one stays on GitHub's free runner.
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # v1.2.3 becomes 1.2.3, 1.2, 1 and latest, all pointing at one index. Someone can
      # pin exactly, follow patches, follow minors, or just take the newest.
      #
      # `latest` is not listed: the action's default `flavor: latest=auto` adds it for a
      # release tag and withholds it for a prerelease, which is what we want. Listing it
      # as well produced it twice.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create the multi-architecture index
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${DOCKERHUB_IMAGE}@sha256:%s " *)

      - name: Check both architectures are in the index
        run: |
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:latest" \
            | tee /tmp/index.txt
          grep -q "linux/amd64" /tmp/index.txt
          grep -q "linux/arm64" /tmp/index.txt
