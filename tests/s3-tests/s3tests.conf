# Configuration for ceph/s3-tests against mock-s3.
#
# Section names and keys follow s3tests.conf.SAMPLE in that repository; the suite reads
# all of them at import time, so a missing section is a collection error rather than a
# test failure. The values matter far less: mock-s3 accepts any credentials.
#
# The suite expects several distinct accounts. mock-s3 has no account model, so these are
# different access keys over the same storage, and every test that checks isolation
# between accounts is expected to fail. That is honest rather than unfortunate — those
# tests are measuring something mock-s3 does not claim to do.

[DEFAULT]
host = mock-s3
port = 9000
is_secure = False
ssl_verify = False

[fixtures]
bucket prefix = s3tests-{random}-
iam name prefix = s3-tests-
iam path prefix = /s3-tests/

[s3 main]
display_name = main
user_id = mock-s3-main
email = main@mock-s3.invalid
api_name = us-east-1
access_key = MAINACCESSKEY0000000
secret_key = main-secret-key-0000000000000000000000000

[s3 alt]
display_name = alt
user_id = mock-s3-alt
email = alt@mock-s3.invalid
access_key = ALTACCESSKEY00000000
secret_key = alt-secret-key-00000000000000000000000000

[s3 tenant]
display_name = tenant
user_id = mock-s3-tenant
email = tenant@mock-s3.invalid
tenant = tenanted
access_key = TENANTACCESSKEY00000
secret_key = tenant-secret-key-0000000000000000000000

[iam]
display_name = iam
user_id = mock-s3-iam
email = iam@mock-s3.invalid
access_key = IAMACCESSKEY00000000
secret_key = iam-secret-key-00000000000000000000000000

[iam root]
display_name = iam-root
user_id = mock-s3-iam-root
email = iam-root@mock-s3.invalid
account_id = MOCKS3000000000000AA
access_key = IAMROOTACCESSKEY0000
secret_key = iam-root-secret-key-0000000000000000000

[iam alt root]
display_name = iam-alt-root
user_id = mock-s3-iam-alt-root
email = iam-alt-root@mock-s3.invalid
account_id = MOCKS3000000000000BB
access_key = IAMALTROOTACCESSKEY0
secret_key = iam-alt-root-secret-key-000000000000000

[webidentity]
token = unused
aud = unused
sub = unused
azp = unused
user_token = unused
thumbprint = unused
KC_REALM = unused
