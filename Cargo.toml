[workspace]
members = ["crates/*", "xtask"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/rapturedotsh/mock-s3"

[workspace.dependencies]
mock-s3-core = { path = "crates/mock-s3-core" }
mock-s3-proto = { path = "crates/mock-s3-proto" }
mock-s3-console = { path = "crates/mock-s3-console" }
mock-s3-testkit = { path = "crates/mock-s3-testkit" }

anyhow = "1.0.95"
async-trait = "0.1.85"
axum = "0.7.9"
bytes = "1.9.0"
chrono = { version = "0.4.39", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4.5.26", features = ["derive", "env"] }
dashmap = "6.1.0"
hex = "0.4.3"
http = "1.2.0"
md-5 = "0.10.6"
percent-encoding = "2.3.1"
# Reading only: CompleteMultipartUpload and DeleteObjects take XML bodies. Responses are
# still built by hand in `mock-s3-proto::xml`, so their shapes stay exact.
quick-xml = "0.37.2"
# The console assets. Embedded in release builds so the binary is self-contained; read
# from web/dist on disk in debug builds, so `pnpm dev` does not need a rebuild.
rust-embed = { version = "8.5.0", features = ["mime-guess"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
tempfile = "3.15.0"
thiserror = "2.0.11"

# Test-only: the conformance suite drives the server with the real AWS SDK, because a
# hand-written HTTP request only proves the handler matches our own understanding. The
# config is built by hand, so aws-config is not needed.
#
# The feature list is the SDK's own default minus `rustls`, which is not the modern TLS
# stack it sounds like: it enables the legacy hyper 0.14 client and with it rustls 0.21
# and hyper-rustls 0.24, two unmaintained lines carrying six advisories between them.
# `default-https-client` is the one that gives the SDK its actual HTTPS connector, and it
# stays, so the client here is still built the way a caller's default SDK builds one.
# Nothing is lost either way: mock-s3 speaks plain HTTP and never grows TLS.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "signal"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
